plugins { id 'com.android.application' }
android {
    namespace 'dev.pico.facialprobe'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '26.1.10909125'
    defaultConfig {
        applicationId 'dev.pico.facialbridge.osc.direct'
        minSdk 29
        targetSdk 29
        versionCode 11
        versionName '0.6.0-osc.4'
        testInstrumentationRunner 'dev.pico.facialprobe.BridgeUiTest'
        ndk { abiFilters 'arm64-v8a' }
    }
    // CI never creates a signing identity. Local signing is explicit and fingerprint-pinned.
    buildTypes {
        debug { signingConfig null }
        release { signingConfig null }
    }
    sourceSets {
        main.java.srcDirs += '../shared/src/main/java'
        // Retained only for probe/host regression tests; never shipped in the direct OSC app.
        main.java.exclude '**/PeerProtocol.java', '**/FramePump.java', '**/DeliveryLedger.java',
                '**/XDeliveryStats.java', '**/TrackingData.java'
    }
    externalNativeBuild { cmake { path '../shared/src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    lint {
        // Firmware-specific Android 10 sideload app, not a Google Play submission.
        // Keep all other lint errors fatal; do not change the runtime target for CI.
        disable 'ExpiredTargetSdkVersion'
    }
}

// Keep the repository's license notices in every distributed bridge APK.
def licenseAssets = layout.buildDirectory.dir('generated/licenseAssets')
tasks.register('copyLicenseAssets', Sync) {
    from rootProject.file('LICENSE'), rootProject.file('THIRD_PARTY_NOTICES.md')
    into licenseAssets
}
android.sourceSets.main.assets.srcDir(licenseAssets)
tasks.named('preBuild').configure { dependsOn 'copyLicenseAssets' }
