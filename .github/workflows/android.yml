name: Android OSC CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test and build arm64 APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build exactly the commit that triggered this CI run.
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          # Only the default branch may populate the shared build cache.
          cache-read-only: ${{ github.event_name != 'push' || github.ref_name != github.event.repository.default_branch }}

      - name: Install pinned Android toolchain
        shell: bash
        run: |
          # The hosted runner supplies the SDK and accepted SDK licenses.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" \
            "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Run core, protocol, cadence and UDP loopback tests
        run: bash tests/run-host-tests.sh

      - name: Check English and Chinese resources
        shell: pwsh
        run: |
          ./tests/check-translations.ps1
          ./tests/check-signing-failclosed.ps1

      - name: Build and lint the bridge
        run: >-
          bash ./gradlew --no-daemon --stacktrace
          :bridge:assembleDebug :bridge:lintDebug

      - name: Check unsigned APK contents and alignment
        shell: bash
        run: |
          python3 tests/test_apk_distribution.py
          # A deployable identity is never created or used on CI.
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify bridge/build/outputs/apk/debug/bridge-debug-unsigned.apk >/dev/null 2>&1; then
            echo "ERROR: CI APK must be unsigned"; exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c 4 \
            bridge/build/outputs/apk/debug/bridge-debug-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            bridge/build/outputs/apk/debug/bridge-debug-unsigned.apk > build/apk-badging.txt
          version=$(sed -n "s/^package: .*versionName='\([^']*\)'.*/\1/p" build/apk-badging.txt)
          test -n "$version"
          grep -q "name='dev.pico.facialbridge.osc.direct' versionCode='11' versionName='0.6.0-osc.4'" build/apk-badging.txt
          grep -q "application-label:'PicoFacialBridge OSC Direct'" build/apk-badging.txt


      - name: Collect CI artifacts
        shell: bash
        run: |
          mkdir -p artifacts/ci
          cp bridge/build/outputs/apk/debug/bridge-debug-unsigned.apk artifacts/ci/PicoFacialBridge-OSC-Direct-unsigned.apk
          cp LICENSE THIRD_PARTY_NOTICES.md artifacts/ci/
          cp build/apk-badging.txt artifacts/ci/
          # Official standalone signing tool from the pinned Android SDK, for local-only signing.
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" artifacts/ci/
          sha256sum artifacts/ci/apksigner.jar > artifacts/ci/apksigner.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build
          path: artifacts/ci/
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint
          path: bridge/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
